# Traefik, the cluster's web entry point, named by digest. The cluster block
# adds the values that tie it to the load balancer, such as its NodePorts and
# the address it publishes, which differ by cluster and never name an image.
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: traefik
  namespace: kube-system
spec:
  chart: traefik
  repo: https://traefik.github.io/charts
  version: 41.6.1
  targetNamespace: traefik
  valuesContent: |
    image:
      tag: v3.7.13@sha256:24841fe2de7304c149343d877d2923b4c8800a38ba015dea9174c23b20e344a0
