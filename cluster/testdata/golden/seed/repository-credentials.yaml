apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: repository-credentials
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/acme/orbitdemo-cluster
    path: repository-credentials
    targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: true
    syncOptions:
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    - group: ""
      kind: Secret
      namespace: argocd
      jsonPointers:
        - /data/password
