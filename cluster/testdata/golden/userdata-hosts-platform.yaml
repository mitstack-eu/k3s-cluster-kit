#cloud-config
write_files:
  - path: /etc/rancher/k3s/config.yaml
    owner: root:root
    permissions: "0600"
    content: |
      cluster-init: true
      disable:
        - local-storage
        - traefik
      flannel-backend: none
      disable-network-policy: true
      disable-kube-proxy: false
      cluster-cidr: 10.42.0.0/16
      service-cidr: 10.43.0.0/16
      cluster-dns: 10.43.0.10
      kubelet-arg:
        - cloud-provider=external
        - volume-plugin-dir=/var/lib/kubelet/volumeplugins
        - kube-reserved=cpu=250m,memory=1500Mi,ephemeral-storage=1Gi
        - system-reserved=cpu=250m,memory=300Mi
      kube-controller-manager-arg:
        - flex-volume-plugin-dir=/var/lib/kubelet/volumeplugins
      kube-apiserver-arg:
        - service-account-issuer=https://mitstack-oidc-abcdefghijklmnopqrstuvwxyz.s3.eu-central-1.amazonaws.com/abcd2345-6f7a-4b2c-9d3e-5f6a7b2c3d4e
        - service-account-jwks-uri=https://mitstack-oidc-abcdefghijklmnopqrstuvwxyz.s3.eu-central-1.amazonaws.com/abcd2345-6f7a-4b2c-9d3e-5f6a7b2c3d4e/openid/v1/jwks
      secrets-encryption: true
  - path: /var/lib/rancher/k3s/server/manifests/cilium.yaml
    owner: root:root
    permissions: "0600"
    content: |
      apiVersion: helm.cattle.io/v1
      kind: HelmChart
      metadata:
        name: cilium
        namespace: kube-system
      spec:
        chart: cilium
        repo: https://helm.cilium.io/
        version: 1.19.3
        targetNamespace: kube-system
        bootstrap: true
        valuesContent: |
          ipam:
            mode: kubernetes
          k8s:
            requireIPv4PodCIDR: true
          ipv4:
            enabled: true
          ipv6:
            enabled: false
          kubeProxyReplacement: false
          k8sServiceHost: "127.0.0.1"
          k8sServicePort: "6444"
          routingMode: "tunnel"
          rollOutCiliumPods: true
          endpointRoutes:
            enabled: true
          loadBalancer:
            acceleration: "best-effort"
          bpf:
            masquerade: false
          hubble:
            relay:
              enabled: true
            ui:
              enabled: true
          MTU: 1450
          operator:
            replicas: 1
            updateStrategy:
              rollingUpdate:
                maxSurge: 0
                maxUnavailable: 1
  - path: /var/lib/rancher/k3s/server/manifests/00-argocd-bootstrap.yaml
    owner: root:root
    permissions: "0600"
    content: |
      apiVersion: v1
      kind: Namespace
      metadata:
        name: argocd
      ---
      apiVersion: helm.cattle.io/v1
      kind: HelmChart
      metadata:
        name: argocd
        namespace: kube-system
      spec:
        chart: argo-cd
        repo: https://argoproj.github.io/argo-helm
        version: 10.9.7
        targetNamespace: argocd
        valuesContent: |
          dex: {enabled: false}
          notifications: {cm: {create: false}, secret: {create: false}}
          configs: {cm: {resource.customizations.health.argoproj.io_Application: 'local h=obj.status and obj.status.health or {} return {status=h.status or "Progressing",message=h.message or ""}'}}
  - path: /var/lib/rancher/k3s/server/manifests/10-cluster-root.yaml
    owner: root:root
    permissions: "0600"
    content: |
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: cluster-root
        namespace: argocd
      spec:
        project: default
        source:
          repoURL: https://github.com/acme/orbitdemo-cluster
          path: cluster
          targetRevision: HEAD
        destination:
          server: https://kubernetes.default.svc
          namespace: argocd
        syncPolicy:
          automated:
            prune: true
            selfHeal: true
  - path: /etc/mitstack/enrolment.env
    owner: root:root
    permissions: "0600"
    content: |
      MITSTACK_ENROLMENT_TOKEN=feedfacefeedfacefeedfacefeedfacefeedfacefeedfacefeedfacefeedface
      MITSTACK_SUBSCRIPTION_ID=abcd2345-6f7a-4b2c-9d3e-5f6a7b2c3d4e
      MITSTACK_REPOSITORY_URL=https://github.com/acme/orbitdemo-cluster
  - path: /etc/mitstack/metadata-guard.nft
    owner: root:root
    permissions: "0600"
    content: |
      # Drops pod traffic to the Hetzner metadata service; loaded by mitstack-metadata-guard.service.
      table inet mitstack_metadata_guard
      delete table inet mitstack_metadata_guard
      table inet mitstack_metadata_guard {
      	chain forward {
      		type filter hook forward priority -10; policy accept;
      		ip daddr 169.254.169.254 counter drop
      	}
      }
  - path: /var/lib/rancher/k3s/server/manifests/01-openbao-seal-key.yaml
    owner: root:root
    permissions: "0600"
    content: |
      apiVersion: v1
      kind: Namespace
      metadata:
        name: openbao
        labels:
          pod-security.kubernetes.io/enforce: restricted
          pod-security.kubernetes.io/enforce-version: latest
      ---
      apiVersion: v1
      kind: Secret
      metadata:
        name: openbao-seal-key
        namespace: openbao
      stringData:
        key: 8d26485ad7c5645f1cf12799be1b701d3cccc5cfe56fe967dbf282199e1af1ce
