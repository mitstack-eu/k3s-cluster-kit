  - path: /var/lib/rancher/k3s/server/manifests/02-boot-components.yaml
    owner: root:root
    permissions: "0600"
    encoding: gz+b64
    content: |
      
  - path: /var/lib/rancher/k3s/server/manifests/02-openbao-tls.yaml
    owner: root:root
    permissions: "0600"
    encoding: gz+b64
    content: |
      
  - path: /var/lib/rancher/k3s/server/manifests/03-cluster-repository.yaml
    owner: root:root
    permissions: "0600"
    encoding: gz+b64
    content: |
      
  - path: /var/lib/rancher/k3s/server/manifests/04-openbao-boot.yaml
    owner: root:root
    permissions: "0600"
    encoding: gz+b64
    content: |
      
  - path: /var/lib/rancher/k3s/server/manifests/05-cluster-repository.yaml.skip
    owner: root:root
    permissions: "0600"
    content: ""
  - path: /etc/systemd/system/mitstack-enrol.timer
    owner: root:root
    permissions: "0644"
    content: |
      [Unit]
      Description=Retry enrolment with the mitstack platform until it answers

      [Timer]
      Unit=mitstack-enrol.service
      OnBootSec=1min
      OnUnitInactiveSec=5min

      [Install]
      WantedBy=timers.target
  - path: /usr/local/sbin/mitstack-hcloud-node
    owner: root:root
    permissions: "0700"
    encoding: gz+b64
    content: |
      
  - path: /usr/local/sbin/mitstack-enrol
    owner: root:root
    permissions: "0700"
    encoding: gz+b64
    content: |
      
  - path: /usr/local/sbin/mitstack-install-k3s
    owner: root:root
    permissions: "0700"
    encoding: gz+b64
    content: |
      
  - path: /etc/systemd/system/mitstack-enrol.service
    owner: root:root
    permissions: "0644"
    content: |
      [Unit]
      Description=Enrol this cluster with the mitstack platform
      Wants=network-online.target
      After=network-online.target
      Before=k3s.service
      ConditionPathExists=!/etc/mitstack/enrolment.json

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/usr/local/sbin/mitstack-enrol
  - path: /etc/systemd/system/mitstack-metadata-guard.service
    owner: root:root
    permissions: "0644"
    content: |
      [Unit]
      Description=Drop pod traffic to the Hetzner metadata service
      Before=k3s.service

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/usr/sbin/nft -f /etc/mitstack/metadata-guard.nft

      [Install]
      WantedBy=multi-user.target
  - path: /etc/systemd/system/k3s.service.d/20-mitstack-metadata-guard.conf
    owner: root:root
    permissions: "0644"
    content: |
      [Unit]
      Requires=mitstack-metadata-guard.service
      After=mitstack-metadata-guard.service
  - path: /etc/systemd/system/apt-daily-upgrade.timer.d/10-mitstack-maintenance-window.conf
    owner: root:root
    permissions: "0644"
    content: |
      [Timer]
      OnCalendar=
      OnCalendar=*-*-* 01:30:00 UTC
      RandomizedDelaySec=0
  - path: /etc/apt/apt.conf.d/52mitstack-unattended-upgrades
    owner: root:root
    permissions: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      Unattended-Upgrade::Allowed-Origins {
      	"${distro_id}:${distro_codename}-updates";
      };
      Unattended-Upgrade::Automatic-Reboot "false";
runcmd:
  - systemctl mask --now ssh.service ssh.socket && systemctl daemon-reload && systemctl enable --now mitstack-metadata-guard.service && install -d -m 0700 /var/lib/openbao && /usr/local/sbin/mitstack-hcloud-node && systemctl enable --now unattended-upgrades.service apt-daily.timer apt-daily-upgrade.timer && systemctl start --no-block apt-daily.service && /usr/local/sbin/mitstack-install-k3s && systemctl enable --now k3s && systemctl enable --now mitstack-enrol.timer
