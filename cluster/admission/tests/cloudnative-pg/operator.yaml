apiVersion: v1
kind: Pod
metadata:
  name: cloudnative-pg-operator
  namespace: cnpg-system
  labels:
    app.kubernetes.io/name: cloudnative-pg
    app.kubernetes.io/instance: cloudnative-pg
    mitstack.dev/app: cloudnative-pg
spec:
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  serviceAccountName: cloudnative-pg
  containers:
  - name: manager
    image: ghcr.io/cloudnative-pg/cloudnative-pg:1.30.1@sha256:923c267ec29636db3bee20f993d0ec4973fa22998e1adad37da79e4d32b5bc07
    command: [/manager]
    args: [controller, --leader-elect, --webhook-port=9443]
    ports:
    - containerPort: 9443
      name: webhook-server
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
      readOnlyRootFilesystem: true
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
