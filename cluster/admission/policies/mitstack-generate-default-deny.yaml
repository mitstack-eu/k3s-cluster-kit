apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: mitstack-generate-default-deny
  annotations:
    mitstack.dev/standard: CIS Kubernetes Benchmark 5.3.2
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  evaluation:
    synchronize:
      enabled: true
    generateExisting:
      enabled: true
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["namespaces"]
  matchConditions:
  - name: not-a-system-namespace
    expression: "!(object.metadata.name in ['kube-system', 'kube-public', 'kube-node-lease', 'argocd', 'kyverno', 'traefik', 'cert-manager', 'system-upgrade', 'mitstack-metadata-probe', 'openbao', 'external-secrets', 'cnpg-system'])"
  variables:
  - name: namespace
    expression: "string(object.metadata.name)"
  - name: defaultDeny
    expression: >-
      [{
        "apiVersion": dyn("networking.k8s.io/v1"),
        "kind": dyn("NetworkPolicy"),
        "metadata": dyn({"name": "mitstack-default-deny", "namespace": variables.namespace}),
        "spec": dyn({"podSelector": {}, "policyTypes": ["Ingress", "Egress"]})
      }]
  generate:
  - expression: generator.Apply(variables.namespace, variables.defaultDeny)
